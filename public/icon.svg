<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <rect width="32" height="32" rx="6" fill="#0f101a"/>
  <defs>
    <linearGradient id="sr-icon-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="17.51%" stopColor="#5b63d3" />
      <stop offset="100%" stopColor="#98a4f7" />
    </linearGradient>
  </defs>

  <!-- Hex-shield container -->
  <polygon
    points="16,4 26.5,9.5 26.5,22.5 16,28 5.5,22.5 5.5,9.5"
    fill="#151621"
    stroke="#939db8"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Radar / freshness arc -->
  <path
    d="M12 16.5C12.8 14 14.8 13 16 13"
    fill="none"
    stroke="#646e87"
    stroke-width="1.2"
    stroke-linecap="round"
    stroke-dasharray="2 2"
  />

  <!-- Inactive/incoming route line -->
  <path
    d="M10.5 23L16 17.5V13"
    fill="none"
    stroke="#939db8"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Verified signal path -->
  <path
    d="M16 13L21.5 8"
    fill="none"
    stroke="url(#sr-icon-gradient)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Beacon node -->
  <circle cx="21.5" cy="8" r="2.2" fill="#98a4f7" />
  <!-- Verification anchor -->
  <circle cx="16" cy="13" r="1.6" fill="#ffffff" />
</svg>
